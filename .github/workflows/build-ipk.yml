name: Build luci-app-smbuser IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: 21.02.7
            target: armvirt/64
            sdk: openwrt-sdk-21.02.7-armvirt-64_gcc-8.4.0_musl.Linux-x86_64.tar.xz
            sdk_dir: openwrt-sdk-21.02.7-armvirt-64_gcc-8.4.0_musl.Linux-x86_64
          - openwrt_version: 23.05.6
            target: armsr/armv8
            sdk: openwrt-sdk-23.05.6-armsr-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            sdk_dir: openwrt-sdk-23.05.6-armsr-armv8_gcc-12.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache fastjar file gawk gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools python-is-python3 rsync unzip wget xz-utils zlib1g-dev

      - name: Download OpenWrt SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/${{ matrix.openwrt_version }}/targets/${{ matrix.target }}/${{ matrix.sdk }}
          tar -xf ${{ matrix.sdk }}

      - name: Prepare feeds
        working-directory: ${{ matrix.sdk_dir }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build package
        run: |
          SRC="$GITHUB_WORKSPACE/src"
          DST="$GITHUB_WORKSPACE/${{ matrix.sdk_dir }}/package/luci-app-smbuser"
          mkdir -p "$DST"
          cp -a "$SRC/Makefile" "$SRC/luasrc" "$SRC/po" "$SRC/root" "$DST/"
          cd "$GITHUB_WORKSPACE/${{ matrix.sdk_dir }}"
          make package/luci-app-smbuser/compile -j$(nproc) V=s

      - name: Collect IPK
        run: |
          mkdir -p artifacts
          ipk=$(find "$GITHUB_WORKSPACE/${{ matrix.sdk_dir }}/bin" -name 'luci-app-smbuser*.ipk' | head -n 1)
          test -n "$ipk" || { echo "IPK not found"; exit 1; }
          cp "$ipk" "artifacts/luci-app-smbuser_1.0-1_openwrt-${{ matrix.openwrt_version }}_all.ipk"
          cd artifacts
          sha256sum *.ipk > SHA256SUMS
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-smbuser-openwrt-${{ matrix.openwrt_version }}
          path: artifacts/*
          if-no-files-found: error
